<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alphabet Order Game</title>

<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Andika', sans-serif;
  text-align: center;
  background: #F1F8E9;
  margin: 0;
  user-select: none;
}

h1 {
  font-size: 34px;
  margin: 14px 0 6px; /* tightened */
  color: #2E7D32;
}

#controls {
  margin-bottom: 6px; /* tightened */
}

select, button {
  font-family: 'Andika', sans-serif;
  font-size: 18px;
  padding: 8px 14px; /* slightly tighter */
  margin: 4px;
  border-radius: 10px;
  border: none;
}

button {
  background: #66BB6A;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #57A05A;
}

#timer {
  font-size: 22px;
  margin: 8px 0; /* tightened */
  color: #33691E;
}

#slots, #cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  margin: 10px auto; /* reduced vertical margin */
  max-width: 1100px;
}

.slot, .card {
  width: 80px;
  height: 90px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: bold;
}

/* Slots */
.slot {
  border: 3px dashed #AED581;
  background: #FFFFFF;
}

.slot.correct {
  background: #C5E1A5;
  border: 3px solid #558B2F;
}

.slot.wrong {
  background: #EF9A9A;
  border: 3px solid #C62828;
}

/* Cards */
.card {
  background: #AED581;
  color: #1B5E20;
  box-shadow: 3px 3px 6px rgba(0,0,0,0.15);
  cursor: grab;
  touch-action: none;
  transition: transform 0.25s ease; /* smooth snap */
}

.card.dragging {
  opacity: 0.6;
}

#celebration {
  position: fixed;
  inset: 0;
  background: rgba(46, 125, 50, 0.9);
  color: white;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 48px;
}

#celebration button {
  font-size: 20px;
  background: #81C784;
  color: #1B5E20;
}
</style>

</head>
<body>

<h1>Put the Alphabet in Order!</h1>

<div id="controls">
  <select id="levelSelect">
    <option value="8">Level 🐣 – 8 Letters</option>
    <option value="16">Level 🐥 – 16 Letters</option>
    <option value="26">Level 🦅 – Full Alphabet</option>
  </select>
  <button onclick="shuffleCards()">Shuffle</button>
  <button onclick="restartGame()">Restart</button>
</div>

<div id="timer">Time: 0s</div>

<div id="slots"></div>

<h2>Alphabet Cards</h2>
<div id="cards"></div>

<div id="celebration">
  🎉 ALL CLEAR! 🎉
  <div id="finalTime"></div>
  <button onclick="restartGame()">▶ Play Again</button>
  <button onclick="exitGame()">❌ Exit</button>
</div>

<script>
// Disable right-click
document.addEventListener("contextmenu", e => e.preventDefault());

const fullAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const slotsContainer = document.getElementById("slots");
const cardsContainer = document.getElementById("cards");
const levelSelect = document.getElementById("levelSelect");

let currentAlphabet = [];
let timer = 0;
let interval;
let gameStarted = false;

function getRandomLetters(count) {
  const shuffled = [...fullAlphabet].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, count);
  return selected.sort(); // Keep correct alphabetical order for slots
}

function initGame() {
  clearInterval(interval);
  timer = 0;
  gameStarted = false;
  document.getElementById("timer").textContent = "Time: 0s";
  document.getElementById("celebration").style.display = "none";

  const levelCount = parseInt(levelSelect.value);
  currentAlphabet = getRandomLetters(levelCount);

  createSlots();
  createCards();
}

function createSlots() {
  slotsContainer.innerHTML = "";
  currentAlphabet.forEach(letter => {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.letter = letter;
    slotsContainer.appendChild(slot);
  });
}

function createCards() {
  cardsContainer.innerHTML = "";
  const shuffled = [...currentAlphabet].sort(() => Math.random() - 0.5);

  shuffled.forEach(letter => {
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = letter;
    card.dataset.letter = letter;
    cardsContainer.appendChild(card);
    enableDrag(card);
  });
}

function enableDrag(card) {
  let offsetX, offsetY;

  card.addEventListener("pointerdown", e => {
    card.setPointerCapture(e.pointerId);
    card.classList.add("dragging");

    if (!gameStarted) {
      startTimer();
      gameStarted = true;
    }

    offsetX = e.offsetX;
    offsetY = e.offsetY;

    card.style.position = "absolute";
    moveAt(e.pageX, e.pageY);

    function moveAt(x, y) {
      card.style.left = x - offsetX + "px";
      card.style.top = y - offsetY + "px";
    }

    function onMove(e) {
      moveAt(e.pageX, e.pageY);
    }

    document.addEventListener("pointermove", onMove);

    card.addEventListener("pointerup", () => {
      document.removeEventListener("pointermove", onMove);
      card.classList.remove("dragging");
      checkDrop(card);
    }, { once: true });
  });
}

function checkDrop(card) {
  const slots = document.querySelectorAll(".slot");
  let placed = false;

  slots.forEach(slot => {
    const rect = slot.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();

    if (
      cardRect.left < rect.right &&
      cardRect.right > rect.left &&
      cardRect.top < rect.bottom &&
      cardRect.bottom > rect.top
    ) {
      if (!slot.textContent) {
        if (slot.dataset.letter === card.dataset.letter) {
          slot.textContent = card.dataset.letter;
          slot.classList.add("correct");
          card.remove();
          checkWin();
        } else {
          slot.classList.add("wrong");
          setTimeout(() => slot.classList.remove("wrong"), 700);
          resetCard(card);
        }
        placed = true;
      }
    }
  });

  if (!placed) resetCard(card);
}

function resetCard(card) {
  card.style.position = "static";
  card.style.left = "";
  card.style.top = "";
}

function startTimer() {
  interval = setInterval(() => {
    timer++;
    document.getElementById("timer").textContent = "Time: " + timer + "s";
  }, 1000);
}

function checkWin() {
  const allCorrect = [...document.querySelectorAll(".slot")]
    .every(slot => slot.classList.contains("correct"));

  if (allCorrect) {
    clearInterval(interval);
    document.getElementById("celebration").style.display = "flex";
    document.getElementById("finalTime").textContent =
      "Finished in " + timer + " seconds!";
  }
}

function shuffleCards() {
  createCards();
}

function restartGame() {
  initGame();
}

function exitGame() {
  window.open('', '_self');
  window.close();
}

levelSelect.addEventListener("change", initGame);

initGame();
</script>

</body>
</html>
