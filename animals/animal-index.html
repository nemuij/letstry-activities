<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sound & Image Matching Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>What's this?</h1>
<p>Match the Sound to the Animal</p>
<div id="timer">⏱️ 0:00</div>

<button id="restartBtn">Restart</button>

<div id="gameBoard" class="game-board"></div>

<div id="celebration" class="celebration hidden">
  <button id="closeCelebration" class="close-btn">✕</button>
  <div id="confetti"></div>
  <h2>🎉 All Clear! 🎉</h2>
  <p>Great listening!</p>
  <button id="celebrationRestartBtn">Play Again</button>
</div>

<script src="script.js"></script>
</body>
</html>
