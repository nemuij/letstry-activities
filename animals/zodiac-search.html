<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZODIAC ANIMAL WORD SEARCH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Andika", sans-serif;
  background: #EBE9E1;
  text-align: center;
  text-transform: uppercase;
  margin: 0;
  user-select: none;
}

h1 { margin-top: 10px; }

.top-bar {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  align-items: center;
}

#timer {
  font-weight: 700;
  font-size: 28px;
  color: #E43D12;
}

.container {
  display: flex;
  justify-content: center;
  gap: 30px;
  align-items: flex-start;
}

.word-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.word-card img { max-width: 70px; }
.word-card.found { opacity: 0.4; }

#grid {
  display: grid;
  grid-template-columns: repeat(13, 42px);
  gap: 8px;
}

.cell {
  font-weight: 600;
  font-size: 28px;
  width: 42px;
  height: 42px;
  background: white;
  color: #E43D12;
  border-radius: 6px;
  border: 1px solid #bbb;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.cell.selected { background: #EFB11D; }
.cell.found { background: #889FD1; pointer-events:none; }
.cell.wrong { background: #D6536D; }

button {
  font-family: "Andika", sans-serif;
  text-transform: uppercase;
  padding: 8px 18px;
  font-size: 16px;
  margin: 5px;
  cursor: pointer;
  border-radius: 30px;
  border: none;
  background: #E43D12;
  color: white;
  font-weight: 600;
}

button:hover { opacity: 0.9; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.overlay-content {
  background: white;
  padding: 30px 40px;
  border-radius: 12px;
  text-align: center;
}

.hidden { display: none; }

.stars { font-size: 30px; margin: 10px 0 15px; }

#finalTime {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 15px;
  color: #889FD1;
  animation: glowPulse 1.6s infinite ease-in-out;
}

@keyframes glowPulse {
  0% { text-shadow: 0 0 5px #889FD1; }
  50% { text-shadow: 0 0 20px #889FD1, 0 0 30px #889FD1; }
  100% { text-shadow: 0 0 5px #889FD1; }
}

/* Rainbow overlay */
#rainbowOverlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1000;
  animation: rainbowFlash 0.5s linear infinite;
}

@keyframes rainbowFlash {
  0% { background: rgba(255,0,0,0.35); }
  20% { background: rgba(255,165,0,0.35); }
  40% { background: rgba(255,255,0,0.35); }
  60% { background: rgba(0,255,0,0.35); }
  80% { background: rgba(0,0,255,0.35); }
  100% { background: rgba(148,0,211,0.35); }
}
</style>
</head>

<body>

<h1>ZODIAC ANIMAL WORD SEARCH</h1>

<div class="top-bar">
  <div id="timer">TIME: READY</div>
  <button id="resetBtn">⟳ RESET</button>
  <button id="showAnswerBtn">ANSWER</button>
</div>

<div class="container">
  <div id="grid"></div>
  <div id="wordList" class="word-panel"></div>
</div>

<div id="allClearScreen" class="overlay hidden">
  <div class="overlay-content">
    <h2>ALL CLEAR!</h2>
    <div class="stars">⭐ ⭐ ⭐</div>
    <div id="finalTime"></div>
    <button onclick="startGame()">PLAY AGAIN</button>
    <button onclick="exitGame()">EXIT</button>
  </div>
</div>

<script>

const ROWS = 10;
const COLS = 13;

const animalPool = [
  { word: "MOUSE", file: "mouse.png" },
  { word: "COW", file: "cow.png" },
  { word: "TIGER", file: "tiger.png" },
  { word: "RABBIT", file: "rabbit.png" },
  { word: "DRAGON", file: "dragon.png" },
  { word: "SNAKE", file: "snake.png" },
  { word: "HORSE", file: "horse.png" },
  { word: "SHEEP", file: "sheep.png" },
  { word: "MONKEY", file: "monkey.png" },
  { word: "CHICKEN", file: "chicken.png" },
  { word: "DOG", file: "dog.png" },
  { word: "WILD BOAR", file: "boar.png" }
];

let activeAnimals = [];
let grid = [];
let selectedCells = [];
let direction = null;
let timer = 0;
let interval = null;
let timerStarted = false;
let gameEnded = false;
let idahoTriggered = false;

document.getElementById("resetBtn").addEventListener("click", startGame);
document.getElementById("showAnswerBtn").addEventListener("click", showAnswers);

function startGame() {
  closeOverlay();
  resetTimer();
  gameEnded = false;
  selectedCells = [];
  direction = null;
  idahoTriggered = false;

  activeAnimals = shuffle([...animalPool]).slice(0,8);
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(""));

  placeWords();
  placeIdaho();
  fillRandomLetters();
  renderGrid();
  renderWordList();
}

function placeIdaho(){
  const word="IDAHO";
  let placed=false;
  while(!placed){
    const horiz=Math.random()<0.5;
    const r=Math.floor(Math.random()*(ROWS-(horiz?0:word.length-1)));
    const c=Math.floor(Math.random()*(COLS-(horiz?word.length-1:0)));
    const fits=word.split("").every((ch,i)=>grid[r+(horiz?0:i)][c+(horiz?i:0)]==="");
    if(fits){
      word.split("").forEach((ch,i)=>grid[r+(horiz?0:i)][c+(horiz?i:0)]=ch);
      placed=true;
    }
  }
}

function handleTap(cell) {
  if (gameEnded) return;
  startTimer();
  if (cell.classList.contains("found")) return;

  const index = Number(cell.dataset.index);
  const r = Math.floor(index / COLS);
  const c = index % COLS;

  if (selectedCells.length === 0) {
    selectedCells.push({r,c,cell});
    cell.classList.add("selected");
    return;
  }

  const last = selectedCells[selectedCells.length-1];

  if (!direction) {
    if (r === last.r) direction = "h";
    else if (c === last.c) direction = "v";
    else return;
  }

  if (direction==="h" && r!==last.r) return;
  if (direction==="v" && c!==last.c) return;
  if (selectedCells.some(s=>s.r===r && s.c===c)) return;

  selectedCells.push({r,c,cell});
  cell.classList.add("selected");

  validateSelection();
}

function validateSelection() {
  const word = selectedCells.map(s=>grid[s.r][s.c]).join("");
  const cleanedWords = activeAnimals.map(a=>a.word.replace(" ",""));
  const idaho = "IDAHO";

  const isPrefix =
    cleanedWords.some(w=>w.startsWith(word)) ||
    idaho.startsWith(word);

  if (!isPrefix) { wrongFlash(); return; }

  if (word === idaho && !idahoTriggered) {
    idahoTriggered = true;
    triggerRainbow();
    selectedCells.forEach(s=>s.cell.classList.remove("selected"));
    selectedCells=[];
    direction=null;
    return;
  }

  if (cleanedWords.includes(word)) {
    markFound(word);
  }
}

function triggerRainbow(){
  const overlay=document.createElement("div");
  overlay.id="rainbowOverlay";
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(),3000);
}

function markFound(word) {
  selectedCells.forEach(s=>{
    s.cell.classList.remove("selected");
    s.cell.classList.add("found");
  });

  const card = document.getElementById(`word-${word}`);
  if(card) card.classList.add("found");

  selectedCells=[];
  direction=null;

  checkAllClear();
}

function wrongFlash() {
  selectedCells.forEach(s=> s.cell.classList.add("wrong"));
  setTimeout(()=>{
    selectedCells.forEach(s=>{
      s.cell.classList.remove("selected","wrong");
    });
    selectedCells=[];
    direction=null;
  },400);
}

function showAnswers() { if (gameEnded) return; gameEnded=true; stopTimer(); }

function exitGame(){ window.close(); }
function startTimer(){ if(timerStarted)return; timerStarted=true; interval=setInterval(()=>{timer++; document.getElementById("timer").textContent=`TIME: ${timer}S`;},1000);}
function stopTimer(){ clearInterval(interval);}
function resetTimer(){clearInterval(interval); timer=0; timerStarted=false; document.getElementById("timer").textContent="TIME: READY";}

function checkAllClear(){
  if(activeAnimals.every(a=>document.getElementById(`word-${a.word.replace(" ","")}`).classList.contains("found"))){
    gameEnded=true; stopTimer();
    document.getElementById("finalTime").textContent=`TIME: ${timer} SECONDS`;
    document.getElementById("allClearScreen").classList.remove("hidden");
  }
}

function closeOverlay(){document.getElementById("allClearScreen").classList.add("hidden");}

function placeWords(){
  activeAnimals.forEach(obj=>{
    let placed=false; const cleanWord=obj.word.replace(" ","");
    while(!placed){
      const horiz=Math.random()<0.5;
      const r=Math.floor(Math.random()*(ROWS-(horiz?0:cleanWord.length-1)));
      const c=Math.floor(Math.random()*(COLS-(horiz?cleanWord.length-1:0)));
      const fits=cleanWord.split("").every((ch,i)=>grid[r+(horiz?0:i)][c+(horiz?i:0)]==="");
      if(fits){
        cleanWord.split("").forEach((ch,i)=>grid[r+(horiz?0:i)][c+(horiz?i:0)]=ch);
        placed=true;
      }
    }
  });
}

function fillRandomLetters(){
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  grid.forEach((row,r)=>row.forEach((cell,c)=>{if(!cell)grid[r][c]=letters[Math.floor(Math.random()*letters.length)];}));
}

function renderGrid(){
  const gridEl=document.getElementById("grid");
  gridEl.innerHTML="";
  grid.flat().forEach((letter,i)=>{
    const cell=document.createElement("div");
    cell.className="cell"; 
    cell.textContent=letter; 
    cell.dataset.index=i;
    cell.onclick=()=>handleTap(cell);
    gridEl.appendChild(cell);
  });
}

function renderWordList(){
  const panel=document.getElementById("wordList");
  panel.innerHTML="";
  activeAnimals.forEach(obj=>{
    const clean=obj.word.replace(" ","");
    const card=document.createElement("div"); 
    card.className="word-card"; 
    card.id=`word-${clean}`;
    const img=document.createElement("img"); 
    img.src=`zodiac-images/${obj.file}`; 
    img.alt=obj.word;
    card.appendChild(img); 
    panel.appendChild(card);
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1)); 
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

document.addEventListener("contextmenu", e => e.preventDefault());

startGame();
</script>
</body>
</html>
