<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fruit Word Search</title>

<style>
  body {
    font-family: Comic Neue, Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin-bottom: 10px;
  }

  .container {
    display: flex;
    justify-content: center;
    gap: 16px; /* tightened */
    align-items: flex-start;
  }

  .grid {
    display: grid;
    gap: 4px;
    background: #333;
    padding: 6px;
    border-radius: 10px;
  }

  .cell {
    width: 56px;
    height: 56px;
    background: white;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    border-radius: 6px;
  }

  .cell.selected {
    background: #cde9ff;
  }

  .cell.found {
    background: #9cffb1;
    animation: rainbow 1.5s linear infinite;
  }

  @keyframes rainbow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .side-panel {
    width: 220px;
    text-align: left;
  }

  .words {
    font-size: 20px;
    margin-bottom: 20px;
  }

  .words div.found {
    text-decoration: line-through;
    color: green;
  }

  .timer {
    font-size: 26px;
    margin-bottom: 12px;
    animation: pulse 1s infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }

  button {
    font-size: 22px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .overlay-content {
    background: white;
    padding: 40px;
    border-radius: 20px;
    font-size: 32px;
  }

  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: red;
    top: -10px;
    animation: fall 3s linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
    }
  }
</style>
</head>

<body>

<h1>🍎 Fruit Word Search 🍌</h1>

<div class="container">
  <div id="grid" class="grid"></div>

  <div class="side-panel">
    <div class="words" id="wordList"></div>
    <div class="timer" id="timer">⏱️ 0.0s</div>
    <button onclick="startGame()">🔁 Play Again</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-content" id="overlayText"></div>
</div>

<script>
const ROWS = 9;
const COLS = 16;

const words = [
  { word: "APPLE", emoji: "🍎" },
  { word: "BANANA", emoji: "🍌" },
  { word: "ORANGE", emoji: "🍊" },
  { word: "GRAPE", emoji: "🍇" },
  { word: "PEACH", emoji: "🍑" },
  { word: "LEMON", emoji: "🍋" },
  { word: "CHERRY", emoji: "🍒" },
  { word: "PEAR", emoji: "🍐" }
];

let grid = [];
let selected = [];
let foundWords = new Set();
let direction = null;
let startTime = null;
let timerInterval = null;

const gridEl = document.getElementById("grid");
const wordListEl = document.getElementById("wordList");
const timerEl = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlayText");

gridEl.style.gridTemplateColumns = `repeat(${COLS}, 56px)`;

function startGame() {
  clearInterval(timerInterval);
  timerEl.textContent = "⏱️ 0.0s";
  startTime = null;
  foundWords.clear();
  direction = null;
  selected = [];

  overlay.style.display = "none";
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(""));

  placeWordsSafely();
  fillGrid();
  renderGrid();
  renderWordList();
}

function placeWordsSafely() {
  for (let w of words) {
    let placed = false;
    let attempts = 0;

    while (!placed && attempts < 200) {
      attempts++;
      const horizontal = Math.random() < 0.5;
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);

      if (horizontal && c + w.word.length <= COLS) {
        if (w.word.split("").every((_, i) => grid[r][c+i] === "")) {
          w.word.split("").forEach((ch,i)=>grid[r][c+i]=ch);
          placed = true;
        }
      }

      if (!horizontal && r + w.word.length <= ROWS) {
        if (w.word.split("").every((_, i) => grid[r+i][c] === "")) {
          w.word.split("").forEach((ch,i)=>grid[r+i][c]=ch);
          placed = true;
        }
      }
    }

    if (!placed) startGame();
  }
}

function fillGrid() {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (let r=0;r<ROWS;r++)
    for (let c=0;c<COLS;c++)
      if (!grid[r][c])
        grid[r][c] = letters[Math.floor(Math.random()*letters.length)];
}

function renderGrid() {
  gridEl.innerHTML = "";
  grid.forEach((row,r)=>{
    row.forEach((ch,c)=>{
      const d = document.createElement("div");
      d.className = "cell";
      d.textContent = ch;
      d.onclick = () => selectCell(d,r,c);
      gridEl.appendChild(d);
    });
  });
}

function selectCell(el,r,c) {
  if (!startTime) {
    startTime = Date.now();
    timerInterval = setInterval(()=>{
      timerEl.textContent = `⏱️ ${((Date.now()-startTime)/1000).toFixed(1)}s`;
    },100);
  }

  if (selected.length === 0) {
    selected.push({el,r,c});
    el.classList.add("selected");
    return;
  }

  if (!direction && selected.length === 1) {
    const dr = r - selected[0].r;
    const dc = c - selected[0].c;
    if (dr === 0) direction = "H";
    else if (dc === 0) direction = "V";
    else return;
  }

  if (
    (direction === "H" && r !== selected[0].r) ||
    (direction === "V" && c !== selected[0].c)
  ) return;

  selected.push({el,r,c});
  el.classList.add("selected");

  checkWord();
}

function checkWord() {
  const str = selected.map(s=>s.el.textContent).join("");
  for (let w of words) {
    if (str === w.word && !foundWords.has(w.word)) {
      foundWords.add(w.word);
      selected.forEach(s=>{
        s.el.classList.remove("selected");
        s.el.classList.add("found");
      });
      direction = null;
      selected = [];
      renderWordList();
      if (foundWords.size === words.length) finishGame();
      return;
    }
  }
}

function renderWordList() {
  wordListEl.innerHTML = "";
  words.forEach(w=>{
    const d = document.createElement("div");
    d.textContent = `${w.emoji} ${w.word}`;
    if (foundWords.has(w.word)) d.classList.add("found");
    wordListEl.appendChild(d);
  });
}

function finishGame() {
  clearInterval(timerInterval);
  overlay.style.display = "flex";
  overlayText.textContent = `🎉 ALL CLEAR! ⏱️ ${timerEl.textContent.replace("⏱️ ","")}`;
  launchConfetti();
}

function launchConfetti() {
  for (let i=0;i<80;i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = `hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

startGame();
</script>
</body>
</html>
