<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FRUIT WORD SEARCH</title>

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>
body {
  font-family: "Comic Neue", cursive;
  background: #fff7ec;
  text-align: center;
  text-transform: uppercase;
  margin: 0;
}

h1 { margin: 10px 0 20px; }

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  align-items: flex-start;
}

/* GRID */
#grid {
  display: grid;
  gap: 6px;
}

.cell {
  width: 56px;
  height: 56px;
  font-size: 26px;
  font-weight: 700;
  background: white;
  border-radius: 8px;
  border: 1px solid #bbb;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}

.cell.selected { background: #cce5ff; }
.cell.found { background: #9be7b2; }

/* SIDE */
.side-panel { width: 260px; }

.word-panel h3 { margin-bottom: 10px; }

.word-panel ul {
  padding: 0;
  margin: 0;
}

.word-panel li {
  list-style: none;
  font-size: 24px;
  margin: 8px 0;
}

.word-panel li.found {
  text-decoration: line-through;
  color: gray;
}

/* CONTROLS */
.controls { margin-top: 20px; }

#timer {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 12px;
}

button {
  font-family: inherit;
  font-size: 20px;
  padding: 10px 20px;
  cursor: pointer;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.overlay-content {
  background: white;
  padding: 40px 50px;
  border-radius: 16px;
}

.overlay-content h2 {
  font-size: 40px;
  margin-bottom: 20px;
}

#finalTime {
  font-size: 36px;
  margin-bottom: 20px;
}

.hidden { display: none; }

/* RAINBOW */
@keyframes rainbowFlash {
  0% { background: #ff6b6b; }
  25% { background: #ffd93d; }
  50% { background: #6bcfff; }
  75% { background: #c77dff; }
  100% { background: #9be7b2; }
}

.cell.rainbow {
  animation: rainbowFlash 0.8s ease-in-out;
}
</style>
</head>

<body>

<h1>🍓 FRUIT WORD SEARCH 🍍</h1>

<div class="container">
  <div id="grid"></div>

  <div class="side-panel">
    <div class="word-panel">
      <h3>Find the fruits</h3>
      <ul id="wordList"></ul>
    </div>

    <div class="controls">
      <div id="timer">TIME: READY</div>
      <button id="resetBtn">RESET</button>
    </div>
  </div>
</div>

<div id="allClearScreen" class="overlay hidden">
  <div class="overlay-content">
    <h2>🎉 ALL CLEAR! 🎉</h2>
    <div id="finalTime"></div>
    <button onclick="startGame()">PLAY AGAIN</button>
  </div>
</div>

<script>
const ROWS = 9;
const COLS = 16;

const fruitPool = [
  { word: "APPLE", emoji: "🍎" },
  { word: "BANANA", emoji: "🍌" },
  { word: "PEACH", emoji: "🍑" },
  { word: "STRAWBERRY", emoji: "🍓" },
  { word: "KIWIFRUIT", emoji: "🥝" },
  { word: "MELON", emoji: "🍈" },
  { word: "GRAPE", emoji: "🍇" },
  { word: "LEMON", emoji: "🍋" },
  { word: "ORANGE", emoji: "🍊" },
  { word: "PINEAPPLE", emoji: "🍍" },
  { word: "CHERRY", emoji: "🍒" }
];

let grid = [];
let activeFruits = [];
let selected = [];
let direction = null;
let timer = 0;
let interval = null;
let started = false;

function startGame() {
  clearSelection();
  stopTimer();
  timer = 0;
  started = false;
  document.getElementById("timer").textContent = "TIME: READY";
  document.getElementById("allClearScreen").classList.add("hidden");

  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(""));

  activeFruits = shuffle([...fruitPool])
    .filter(f => !(f.word === "APPLE" && fruitPool.some(x => x.word === "PINEAPPLE")))
    .slice(0, 8);

  if (activeFruits.some(f => f.word === "APPLE"))
    activeFruits = activeFruits.filter(f => f.word !== "PINEAPPLE");
  if (activeFruits.some(f => f.word === "PINEAPPLE"))
    activeFruits = activeFruits.filter(f => f.word !== "APPLE");

  placeWords();
  fillLetters();
  renderGrid();
  renderList();
}

function placeWords() {
  activeFruits.forEach(f => {
    let placed = false;
    while (!placed) {
      const horiz = Math.random() < 0.5;
      const r = rand(ROWS - (horiz ? 0 : f.word.length - 1));
      const c = rand(COLS - (horiz ? f.word.length - 1 : 0));

      if (f.word.split("").every((ch, i) =>
        grid[r + (horiz ? 0 : i)][c + (horiz ? i : 0)] === ""
      )) {
        f.word.split("").forEach((ch, i) =>
          grid[r + (horiz ? 0 : i)][c + (horiz ? i : 0)] = ch
        );
        placed = true;
      }
    }
  });
}

function fillLetters() {
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  grid.forEach((row, r) =>
    row.forEach((cell, c) => {
      if (!cell) grid[r][c] = letters[rand(letters.length)];
    })
  );
}

function renderGrid() {
  const el = document.getElementById("grid");
  el.innerHTML = "";
  el.style.gridTemplateColumns = `repeat(${COLS}, 56px)`;

  grid.flat().forEach((l, i) => {
    const d = document.createElement("div");
    d.className = "cell";
    d.textContent = l;
    d.dataset.index = i;
    d.onclick = e => selectCell(e.target);
    el.appendChild(d);
  });
}

function renderList() {
  const ul = document.getElementById("wordList");
  ul.innerHTML = "";
  activeFruits.forEach(f => {
    const li = document.createElement("li");
    li.id = `word-${f.word}`;
    li.textContent = `${f.emoji} ${f.word}`;
    ul.appendChild(li);
  });
}

function selectCell(cell) {
  startTimer();

  if (cell.classList.contains("found")) return;

  if (!selected.length) {
    selected.push(cell);
    cell.classList.add("selected");
    return;
  }

  if (selected.includes(cell)) return;

  const last = selected[selected.length - 1];
  const diff = cell.dataset.index - last.dataset.index;

  if (!direction) {
    if (Math.abs(diff) === 1) direction = "h";
    else if (Math.abs(diff) === COLS) direction = "v";
    else return;
  }

  if (
    (direction === "h" && Math.abs(diff) !== 1) ||
    (direction === "v" && Math.abs(diff) !== COLS)
  ) return;

  selected.push(cell);
  cell.classList.add("selected");
  checkWord();
}

function checkWord() {
  const word = selected.map(c => c.textContent).join("");
  const rev = [...word].reverse().join("");

  const match = activeFruits.find(f => f.word === word || f.word === rev);
  if (!match) return;

  selected.forEach(c => {
    c.classList.remove("selected");
    c.classList.add("found", "rainbow");
  });

  document.getElementById(`word-${match.word}`).classList.add("found");
  clearSelection();
  checkFinish();
}

function clearSelection() {
  selected.forEach(c => c.classList.remove("selected"));
  selected = [];
  direction = null;
}

document.body.addEventListener("click", e => {
  if (!e.target.classList.contains("cell")) clearSelection();
});

function checkFinish() {
  if (activeFruits.every(f =>
    document.getElementById(`word-${f.word}`).classList.contains("found")
  )) {
    stopTimer();
    document.getElementById("finalTime").textContent = `⏱ ${timer} seconds`;
    document.getElementById("allClearScreen").classList.remove("hidden");
  }
}

function startTimer() {
  if (started) return;
  started = true;
  interval = setInterval(() => {
    timer++;
    document.getElementById("timer").textContent = `TIME: ${timer}s`;
  }, 1000);
}

function stopTimer() {
  clearInterval(interval);
}

function rand(n) { return Math.floor(Math.random() * n); }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = rand(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

document.getElementById("resetBtn").onclick = startGame;
startGame();
</script>

</body>
</html>
