<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🏫 I Like My School 🎒</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika&display=swap" rel="stylesheet">

<style>
/* ================= GLOBAL ================= */
* {
  box-sizing: border-box;
  font-family: 'Andika', sans-serif;
}

body {
  margin: 0;
  background: #fbd000;
  text-align: center;
}

h1 {
  margin: 10px 0;
  color: #fff;
  text-shadow: 2px 2px #000;
}

small {
  opacity: 0.6;
}

/* ================= GAME LAYOUT ================= */
#game.hidden { display: none; }

#game {
  display: grid;
  grid-template-columns: 0.6fr 1.9fr 0.6fr;
  gap: 8px;
  padding: 8px;
}

/* ================= PLAYER AREAS ================= */
.player {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px;
  border-radius: 14px;
  color: #fff;
}

.blue { background: #049cd8; }
.green { background: #43b047; }

.player.active {
  outline: 10px solid #e60012;
}

#p1Name, #p2Name {
  font-size: 3em;
  line-height: 1;
}

/* ================= CARD AREAS ================= */
.card-area {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.card {
  height: 150px;
  border-radius: 10px;
  cursor: pointer;
}

#player1Cards .card,
#player2Cards .card {
  height: 70px;
}

.locked .card {
  pointer-events: none;
  opacity: 0.5;
}

/* ================= SKIP BUTTON ================= */
.skip-btn {
  margin-top: 14px;
  font-size: 26px;
  padding: 16px 32px;
  border-radius: 16px;
  background: #e60012;
  color: #fff;
  border: none;
  cursor: pointer;
}

.skip-btn:hover {
  background: #b0000d;
}

.skip-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ================= OVERLAYS ================= */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 100;
}

.overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.overlayBox,
#overlayContent {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
}

/* ================= TOKEN SELECTION ================= */
.tokens {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

.tokens button {
  display: flex;
  justify-content: center;
  align-items: center;

  width: 80px;
  height: 80px;

  font-size: 3.5em;
  line-height: 1;
  padding: 0;

  border-radius: 20px;
  border: 2px solid #000;
  background: #fff;
  cursor: pointer;
  transition: transform 0.2s;
}

.tokens button:hover {
  transform: scale(1.2);
}

.tokens button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ================= BUTTONS ================= */
button {
  font-size: 18px;
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #43b047;
  color: #fff;
  margin: 6px;
}

/* ================= TROPHY ================= */
#trophy {
  font-size: 3em;
  animation: bounce 0.8s infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-15px); }
}
</style>
</head>

<body>

<h1>🏫 I Like My School 🎒</h1>

<!-- TOKEN SELECTION -->
<div id="tokenOverlay" class="overlay show">
  <div class="overlayBox">
    <h2>Choose Your Token</h2>
    <div class="tokens">
      <button data-token="🌵">🌵</button>
      <button data-token="🌻">🌻</button>
      <button data-token="🍄">🍄</button>
      <button data-token="🍀">🍀</button>
      <button data-token="🌰">🌰</button>
    </div>
    <p id="tokenMessage">Player 1, choose a token</p>
  </div>
</div>

<!-- GAME -->
<div id="game" class="hidden">
  <div id="player1" class="player blue active">
    <h2 id="p1Name"></h2>
    <p>Cards: <span id="p1Count">0</span></p>
    <div id="player1Cards" class="card-area"></div>
  </div>

<div class="center">
  <h2>Cards</h2>
  <button id="skipBtn" class="skip-btn">SKIP TURN</button>
  <div id="centerCards" class="card-area"></div>
</div>


  <div id="player2" class="player green">
    <h2 id="p2Name"></h2>
    <p>Cards: <span id="p2Count">0</span></p>
    <div id="player2Cards" class="card-area"></div>
  </div>
</div>

<!-- CARD OVERLAY -->
<div id="overlay" class="overlay">
  <div id="overlayContent">
    <img id="overlayCard" width="260">
    <p id="grammarText"></p>
    <button id="getBtn">GET</button>
  </div>
</div>

<!-- END SCREEN -->
<div id="endScreen" class="overlay">
  <div class="overlayBox">
    <h2 id="winnerText"></h2>
    <div id="trophy">🏆</div>
    <button id="playAgainBtn">Play Again</button>
    <button id="homeBtn">Return Home</button>
  </div>
</div>

<script>
/* ================= VERSION ================= */
const VERSION = "Goodv1";

/* ================= ELEMENTS ================= */
const tokenOverlay = document.getElementById("tokenOverlay");
const tokenMessage = document.getElementById("tokenMessage");
const tokenButtons = document.querySelectorAll(".tokens button");

const game = document.getElementById("game");
const centerCardsEl = document.getElementById("centerCards");
const skipBtn = document.getElementById("skipBtn");

const overlay = document.getElementById("overlay");
const overlayCard = document.getElementById("overlayCard");
const grammarText = document.getElementById("grammarText");
const getBtn = document.getElementById("getBtn");

const p1Name = document.getElementById("p1Name");
const p2Name = document.getElementById("p2Name");
const p1Cards = document.getElementById("player1Cards");
const p2Cards = document.getElementById("player2Cards");
const p1Count = document.getElementById("p1Count");
const p2Count = document.getElementById("p2Count");

const endScreen = document.getElementById("endScreen");
const winnerText = document.getElementById("winnerText");
const playAgainBtn = document.getElementById("playAgainBtn");
const homeBtn = document.getElementById("homeBtn");

/* ================= STATE ================= */
let currentPlayer = 1;
let selectedCard = null;
let locked = false;
let tokenStep = 1;

/* ================= CARD DATA ================= */
const cards = [
  { img: "../school-image/aandc.png", name: "art room" },
  { img: "../school-image/classroom1.png", name: "classroom" },
  { img: "../school-image/cookingroom.png", name: "cooking room" },
  { img: "../school-image/entrance.png", name: "entrance" },
  { img: "../school-image/gym.png", name: "gym" },
  { img: "../school-image/library.png", name: "library" },
  { img: "../school-image/lunchroom.png", name: "lunch room" },
  { img: "../school-image/musicroom.png", name: "music room" },
  { img: "../school-image/nursesoffice.png", name: "nurse's office" },
  { img: "../school-image/playground.png", name: "playground" },
  { img: "../school-image/principalsoffice.png", name: "principal's office" },
  { img: "../school-image/restroom.png", name: "restroom" },
  { img: "../school-image/scienceroom.png", name: "science room" },
  { img: "../school-image/teachersoffice.png", name: "teacher's office" },
  { img: "../school-image/homeecroom.png", name: "home economics room" },
  { img: "../school-image/englishroom.png", name: "English room" },
  { img: "../school-image/broadcastroom.png", name: "broadcasting room" }
];


/* ================= TOKEN SELECTION ================= */
tokenButtons.forEach(btn=>{
  btn.onclick=()=>{
    if(tokenStep===1){
      p1Name.textContent=btn.dataset.token;
      btn.disabled=true;
      tokenMessage.textContent="Player 2, choose a token";
      tokenStep=2;
    } else if(tokenStep===2){
      p2Name.textContent=btn.dataset.token;
      tokenOverlay.classList.remove("show");
      game.classList.remove("hidden");
      startGame();
      tokenStep=3;
    }
  };
});

/* ================= GAME ================= */
function startGame(){
  shuffle(cards);
  centerCardsEl.innerHTML="";
  cards.forEach(card=>{
    const img=document.createElement("img");
    img.src=card.img;
    img.className="card";
    img.dataset.name=card.name;
    img.onclick=()=>!locked && openOverlay(img);
    centerCardsEl.appendChild(img);
  });
  updateTurnUI();
}

function openOverlay(card){
  locked=true;
  skipBtn.disabled=true;
  selectedCard=card;
  overlayCard.src=card.src;
  grammarText.textContent=`I like the ${card.dataset.name}.`;
  overlay.classList.add("show");
}

getBtn.onclick=()=>{
  overlay.classList.remove("show");
  const target=currentPlayer===1?p1Cards:p2Cards;
  target.appendChild(selectedCard);
  selectedCard=null;
  locked=false;
  skipBtn.disabled=false;
  updateCounts();

  if(centerCardsEl.children.length===0){
    endGame();
  } else {
    currentPlayer=currentPlayer===1?2:1;
    updateTurnUI();
  }
};

/* ================= SKIP TURN ================= */
skipBtn.onclick=()=>{
  if(locked) return;
  currentPlayer=currentPlayer===1?2:1;
  updateTurnUI();
};

/* ================= END GAME ================= */
function endGame(){
  winnerText.textContent =
    p1Cards.children.length > p2Cards.children.length ? `${p1Name.textContent} wins!` :
    p2Cards.children.length > p1Cards.children.length ? `${p2Name.textContent} wins!` :
    "It's a tie!";
  endScreen.classList.add("show");
}

/* ================= BUTTONS ================= */
playAgainBtn.onclick=()=>location.reload();
homeBtn.onclick=()=>window.location.href="https://redsrandomproject.my.canva.site/try2unit8";

/* ================= HELPERS ================= */
function updateTurnUI(){
  document.getElementById("player1").classList.toggle("active",currentPlayer===1);
  document.getElementById("player2").classList.toggle("active",currentPlayer===2);
}

function updateCounts(){
  p1Count.textContent=p1Cards.children.length;
  p2Count.textContent=p2Cards.children.length;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

document.addEventListener("contextmenu",e=>e.preventDefault());
</script>

</body>
</html>
