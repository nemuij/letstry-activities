<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPORTS WORD SEARCH</title>

<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">

<style>
body { font-family:"Andika",sans-serif; background:#1e7f3b; text-align:center; user-select:none; }
h1 { margin:14px 0 22px; font-size:42px; font-weight:700; color:white; text-shadow:0 4px 8px rgba(0,0,0,0.6); }
.container { display:flex; justify-content:center; gap:14px; align-items:flex-start; }
#grid { display:grid; gap:4px; column-gap:8px; border:6px solid white; padding:10px; border-radius:14px; }
.cell { width:52px; height:52px; font-size:30px; background:white; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.cell.selected { background:#d9f99d; }
.cell.found { background:#22c55e; color:#083344; }
.cell.penalty { background:#ef4444; color:white; animation:shake .35s; }
@keyframes shake { 0%{transform:translateX(0);}25%{transform:translateX(-3px);}50%{transform:translateX(3px);}75%{transform:translateX(-3px);}100%{transform:translateX(0);} }
@keyframes rainbow { 0%{background:#ff0000;}14%{background:#ff7f00;}28%{background:#ffff00;}42%{background:#00ff00;}57%{background:#0000ff;}71%{background:#4b0082;}85%{background:#8f00ff;}100%{background:#ff0000;} }
.cell.idaho { animation:rainbow 1s linear infinite; color:white!important; }
.side-panel { width:220px; text-align:left; }
.case-toggle { display:flex; justify-content:center; gap:10px; margin-bottom:12px; }
.toggle-option { display:flex; align-items:center; justify-content:center; font-size:18px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.25); color:white; cursor:pointer; transition:.2s; }
.toggle-option.active { background:white; color:#166534; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,.3); }
.word-panel { border:4px solid white; border-radius:12px; padding:14px 16px; background:rgba(255,255,255,.15); }
.word-panel h3 { margin-top:0; text-align:center; color:white; }
.word-panel ul { padding:0; margin:0; }
.word-panel li { list-style:none; font-size:22px; margin:8px 0; color:white; }
.word-panel li.found { text-decoration:line-through; color:#333; }
.controls { margin-top:18px; text-align:center; }
#timer { font-size:26px; font-weight:bold; margin-bottom:12px; color:white; }
button { font-family:inherit; font-size:20px; padding:10px 22px; cursor:pointer; background:#16a34a; color:white; border:none; border-radius:10px; }
button:hover { background:#22c55e; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:999; }
.overlay-content { background:#f0fdf4; padding:40px 50px; border-radius:16px; }
.overlay-content h2 { font-size:40px; margin-bottom:20px; }
#finalTime { font-size:36px; margin-bottom:20px; }
.hidden { display:none; }
</style>
</head>

<body>

<h1>⚽ SPORTS WORD SEARCH 🏀</h1>

<div class="container">
<div id="grid"></div>

<div class="side-panel">
<div class="case-toggle">
<span class="toggle-option active" data-case="upper">🔠 ABC</span>
<span class="toggle-option" data-case="lower">🔡 abc</span>
</div>

<div class="word-panel">
<h3>Find the Sports</h3>
<ul id="wordList"></ul>
</div>

<div class="controls">
<div id="timer">TIME: READY</div>
<button id="resetBtn">⟳</button>
<button id="solutionsBtn">👁</button>
</div>
</div>
</div>

<div id="allClearScreen" class="overlay hidden">
<div class="overlay-content">
<h2>🎉 ALL CLEAR! 🎉</h2>
<div id="finalTime"></div>
<button id="playAgainBtn">PLAY AGAIN</button>
<button id="exitBtn">EXIT</button>
</div>
</div>

<script>
const ROWS=9;
const COLS=16;
const WORD_COUNT=6;
const hiddenWords=["IDAHO"];

const sportPool=[
{word:"SOCCER",emoji:"⚽"},
{word:"BASEBALL",emoji:"⚾"},
{word:"TENNIS",emoji:"🎾"},
{word:"BASKETBALL",emoji:"🏀"},
{word:"SWIMMING",emoji:"🏊"},
{word:"SKIING",emoji:"⛷️"},
{word:"SKATING",emoji:"⛸️"},
{word:"RUGBY",emoji:"🏉"},
{word:"HOCKEY",emoji:"🏒"},
{word:"VOLLEYBALL",emoji:"🏐"},
{word:"BADMINTON",emoji:"🏸"},
{word:"JUDO",emoji:"🥋"},
{word:"TABLETENNIS",emoji:"🏓",label:"TABLE TENNIS"},
{word:"RUNNING",emoji:"🏃"},
{word:"GYMNASTICS",emoji:"🤸"},
{word:"BOXING",emoji:"🥊"},
{word:"CYCLING",emoji:"🚴"},
{word:"GOLF",emoji:"⛳"}
];

let activeSports=[];
let grid=[];
let selectedCells=[];
let lockDirection=null;
let startCell=null;
let timer=0;
let interval=null;
let useUppercase=true;

function setToggleLocked(locked){
document.querySelectorAll(".toggle-option").forEach(opt=>{
opt.style.pointerEvents=locked?"none":"auto";
opt.style.opacity=locked?"0.45":"1";
});
}

document.querySelectorAll(".toggle-option").forEach(btn=>{
btn.addEventListener("click",()=>{
if(interval) return;
document.querySelectorAll(".toggle-option").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
useUppercase=btn.dataset.case==="upper";
renderGrid();
renderWordList();
});
});

function rand(n){return Math.floor(Math.random()*n);}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rand(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function startTimer(){if(interval) return;setToggleLocked(true);interval=setInterval(()=>{timer++;document.getElementById("timer").textContent=`TIME: ${timer}s`;},1000);}
function stopTimer(){clearInterval(interval);interval=null;}
function resetTimer(){stopTimer();timer=0;document.getElementById("timer").textContent="TIME: READY";setToggleLocked(false);}

function placeWords(){
for(const obj of activeSports){
let placed=false;
let attempts=0;

while(!placed && attempts<200){
attempts++;
const across=Math.random()<0.5;

if(across){
const r=rand(ROWS);
const c=rand(COLS-obj.word.length+1);
if(obj.word.split("").every((_,i)=>!grid[r][c+i])){
obj.word.split("").forEach((ch,i)=>grid[r][c+i]=ch);
placed=true;
}
}else{
const r=rand(ROWS-obj.word.length+1);
const c=rand(COLS);
if(obj.word.split("").every((_,i)=>!grid[r+i][c])){
obj.word.split("").forEach((ch,i)=>grid[r+i][c]=ch);
placed=true;
}
}
}

if(!placed) return false; // fail entire board
}

return true; // all words placed
}

function placeHidden(){
hiddenWords.forEach(word=>{
let placed=false;
while(!placed){
const across=Math.random()<0.5;
if(across){
const r=rand(ROWS);
const c=rand(COLS-word.length+1);
if(word.split("").every((_,i)=>!grid[r][c+i])){
word.split("").forEach((ch,i)=>grid[r][c+i]=ch);
placed=true;
}
}else{
const r=rand(ROWS-word.length+1);
const c=rand(COLS);
if(word.split("").every((_,i)=>!grid[r+i][c])){
word.split("").forEach((ch,i)=>grid[r+i][c]=ch);
placed=true;
}
}
}
});
}

function fillRandomLetters(){
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
grid.flat().forEach((_,i)=>{
const r=Math.floor(i/COLS);
const c=i%COLS;
if(!grid[r][c]) grid[r][c]=letters[rand(letters.length)];
});
}

function renderGrid(){
const gridEl=document.getElementById("grid");
gridEl.innerHTML="";
gridEl.style.gridTemplateColumns=`repeat(${COLS}, 52px)`;
grid.flat().forEach((letter,index)=>{
const cell=document.createElement("div");
cell.className="cell";
cell.textContent=useUppercase?letter:letter.toLowerCase();
cell.dataset.index=index;
cell.addEventListener("click",()=>handleTap(cell));
gridEl.appendChild(cell);
});
}

function renderWordList(){
const ul=document.getElementById("wordList");
ul.innerHTML="";
activeSports.forEach(s=>{
const li=document.createElement("li");
li.id=`word-${s.word}`;
const name=s.label||s.word;
li.textContent=`${s.emoji} ${useUppercase?name:name.toLowerCase()}`;
ul.appendChild(li);
});
}

function handleTap(cell){
if(cell.classList.contains("found")) return;
startTimer();
if(!startCell){startCell=cell;selectCell(cell);return;}
const start=Number(startCell.dataset.index);
const current=Number(cell.dataset.index);
const sr=Math.floor(start/COLS);
const sc=start%COLS;
const cr=Math.floor(current/COLS);
const cc=current%COLS;
if(!lockDirection){
if(sr===cr) lockDirection="row";
else if(sc===cc) lockDirection="col";
else return wrongImmediate();
}
if((lockDirection==="row"&&sr===cr)||(lockDirection==="col"&&sc===cc)){
selectCell(cell);
checkSelectionImmediate();
}else wrongImmediate();
}

function selectCell(cell){
if(!cell.classList.contains("selected")){
cell.classList.add("selected");
selectedCells.push(cell);
}
}

function clearSelection(){
selectedCells.forEach(c=>c.classList.remove("selected","penalty"));
selectedCells=[];
startCell=null;
lockDirection=null;
}

function wrongImmediate(){
selectedCells.forEach(c=>c.classList.add("penalty"));
setTimeout(clearSelection,350);
}

function checkSelectionImmediate(){
const text=selectedCells.map(c=>c.textContent.toUpperCase()).join("");
const rev=text.split("").reverse().join("");
const allWords=[...activeSports.map(s=>s.word),...hiddenWords];

const exactSport=activeSports.find(s=>s.word===text||s.word===rev);
if(exactSport){
selectedCells.forEach(c=>c.classList.add("found"));
document.getElementById(`word-${exactSport.word}`).classList.add("found");
clearSelection();
checkAllClear();
return;
}

const exactHidden=hiddenWords.find(w=>w===text||w===rev);
if(exactHidden){
selectedCells.forEach(c=>c.classList.add("idaho"));
setTimeout(()=>{selectedCells.forEach(c=>c.classList.remove("idaho"));clearSelection();},2000);
return;
}

const possible=allWords.some(w=>w.startsWith(text)||w.startsWith(rev));
if(!possible) wrongImmediate();
}

function checkAllClear(){
if(activeSports.every(s=>document.getElementById(`word-${s.word}`).classList.contains("found"))){
stopTimer();
document.getElementById("finalTime").textContent=`⏱ ${timer} seconds`;
document.getElementById("allClearScreen").classList.remove("hidden");
}
}

function showSolutions(){
stopTimer();
setToggleLocked(true);
const cells=document.querySelectorAll(".cell");
activeSports.forEach(s=>{
for(let r=0;r<ROWS;r++){
for(let c=0;c<COLS;c++){
if(c+s.word.length<=COLS){
if(grid[r].slice(c,c+s.word.length).join("")===s.word){
for(let i=0;i<s.word.length;i++) cells[r*COLS+c+i].classList.add("found");
}
}
if(r+s.word.length<=ROWS){
let v="";
for(let i=0;i<s.word.length;i++) v+=grid[r+i][c];
if(v===s.word){
for(let i=0;i<s.word.length;i++) cells[(r+i)*COLS+c].classList.add("found");
}
}
}
}
document.getElementById(`word-${s.word}`).classList.add("found");
});
cells.forEach(c=>c.style.pointerEvents="none");
}

function softReset(){
stopTimer();
clearSelection();
resetTimer();
document.getElementById("allClearScreen").classList.add("hidden");

let success=false;

while(!success){
activeSports=shuffle([...sportPool]).slice(0,WORD_COUNT);
grid=Array.from({length:ROWS},()=>Array(COLS).fill(""));

success=placeWords();
if(success) placeHidden();
}

fillRandomLetters();
renderGrid();
renderWordList();
}

document.getElementById("resetBtn").onclick=softReset;
document.getElementById("solutionsBtn").onclick=showSolutions;
document.getElementById("playAgainBtn").onclick=softReset;
document.getElementById("exitBtn").onclick=()=>{window.close();};

softReset();

/* === Disable Right Click === */
document.addEventListener("contextmenu", function (e) {
  e.preventDefault();
});

/* === Disable Common DevTools Shortcuts === */
document.addEventListener("keydown", function (e) {
  // F12
  if (e.key === "F12") {
    e.preventDefault();
  }

  // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
  if (e.ctrlKey && e.shiftKey &&
      (e.key === "I" || e.key === "J" || e.key === "C")) {
    e.preventDefault();
  }

  // Ctrl+U (view source)
  if (e.ctrlKey && e.key === "u") {
    e.preventDefault();
  }
});
</script>

</body>
</html>
